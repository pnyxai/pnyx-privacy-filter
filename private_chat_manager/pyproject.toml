[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "private-chat-manager"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "tritonclient[http]>=2.44",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "openai>=2.0.0",
    "structlog>=24.1",
]

# Extra group used by the Docker image so the stub install above shares the
# same dependency list without duplicating it.
[project.optional-dependencies]
prod = []

test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
